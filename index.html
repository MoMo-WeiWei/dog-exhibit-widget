<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浪浪故事輪播牆｜等一個不放開的家</title>
  <style>
    :root {
      --bg-color: #f6f2eb;          /* 溫潤燕麥紙背景 */
      --frame-bg: #fffdf9;          /* 拍立得暖白相紙 */
      --primary: #c86d51;           /* 陶土暖橘 */
      --primary-hover: #b3593e;
      --secondary: #e2b879;         /* 麥穗暖黃 */
      --text-main: #3e3a36;         /* 暖炭黑字體 */
      --text-muted: #847c74;        /* 暖灰褐字體 */
      --tag-bg: #f3ece1;
      --shadow: 0 14px 32px rgba(62, 58, 54, 0.10), 0 2px 6px rgba(62, 58, 54, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    body {
      position: relative;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 14px 16px;
      overflow: hidden;
    }

    /* 全螢幕特效層 */
    .fx-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .screen-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9990;
      opacity: 0;
    }

    .screen-flash.pet-flash {
      background: radial-gradient(circle at center, rgba(255, 143, 163, 0.24) 0%, rgba(255, 143, 163, 0) 72%);
      animation: softPulse 0.9s ease-out forwards;
    }

    .screen-flash.treat-flash {
      background: radial-gradient(circle at center, rgba(249, 199, 79, 0.26) 0%, rgba(249, 199, 79, 0) 72%);
      animation: softPulse 0.9s ease-out forwards;
    }

    @keyframes softPulse {
      0% { opacity: 0; transform: scale(0.95); }
      35% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }

    /* 中央Q版小劇場舞台 */
    .chibi-stage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      width: 300px;
      height: 220px;
      background: rgba(255, 253, 249, 0.96);
      border: 2px solid #eadfd2;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(62, 58, 54, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 10001;
      backdrop-filter: blur(8px);
    }

    .chibi-stage.show {
      animation: stagePop 1.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes stagePop {
      0% { opacity: 0; transform: translate(-50%, -42%) scale(0.72); }
      16% { opacity: 1; transform: translate(-50%, -50%) scale(1.03); }
      24% { transform: translate(-50%, -50%) scale(1); }
      78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -58%) scale(0.92); }
    }

    .chibi-caption {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    /* Q版摸頭與開罐動畫 */
    .chibi-hand-group {
      transform-origin: 155px 52px;
      animation: patHeadMotion 0.42s ease-in-out infinite alternate;
    }
    @keyframes patHeadMotion {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      100% { transform: translate(-4px, 9px) rotate(-7deg); }
    }

    .chibi-dog-head {
      transform-origin: 185px 115px;
      animation: dogHappyBob 0.42s ease-in-out infinite alternate;
    }
    @keyframes dogHappyBob {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(3px) rotate(3deg); }
    }

    .chibi-tail {
      transform-origin: 235px 128px;
      animation: wagTailFast 0.22s ease-in-out infinite alternate;
    }
    @keyframes wagTailFast {
      0% { transform: rotate(-16deg); }
      100% { transform: rotate(18deg); }
    }

    .chibi-sparkle {
      transform-origin: center;
      animation: sparkleTwinkle 0.8s ease-in-out infinite alternate;
    }
    @keyframes sparkleTwinkle {
      0% { opacity: 0.35; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    .can-lid {
      transform-origin: 120px 82px;
      animation: openLidAnim 1.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes openLidAnim {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      28% { transform: translate(24px, -36px) rotate(38deg); opacity: 1; }
      100% { transform: translate(42px, -55px) rotate(55deg); opacity: 0; }
    }

    .can-food-puff {
      opacity: 0;
      transform-origin: 150px 95px;
      animation: foodPopUp 1.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes foodPopUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.5); }
      30% { opacity: 1; transform: translateY(-10px) scale(1.08); }
      75% { opacity: 1; transform: translateY(-18px) scale(1); }
      100% { opacity: 0; transform: translateY(-26px) scale(0.9); }
    }

    .can-body {
      animation: canBounce 0.55s ease-out;
    }
    @keyframes canBounce {
      0% { transform: scaleY(0.88) scaleX(1.08); }
      50% { transform: scaleY(1.05) scaleX(0.96); }
      100% { transform: scaleY(1) scaleX(1); }
    }

    /* 全螢幕飄浮元素 */
    .fx-item {
      position: absolute;
      bottom: -40px;
      left: var(--x, 50%);
      font-size: var(--size, 26px);
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.1));
      animation: riseAcrossScreen var(--dur, 1.85s) cubic-bezier(0.22, 0.85, 0.36, 1) forwards;
      animation-delay: var(--delay, 0s);
      opacity: 0;
    }

    @keyframes riseAcrossScreen {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.4) rotate(0deg); }
      15% { opacity: 1; transform: translate(calc(-50% + var(--sway1, 15px)), -15vh) scale(1.15) rotate(var(--rot1, 12deg)); }
      55% { opacity: 1; transform: translate(calc(-50% + var(--sway2, -18px)), -55vh) scale(1) rotate(var(--rot2, -15deg)); }
      85% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--sway3, 10px)), -105vh) scale(0.85) rotate(var(--rot3, 18deg)); }
    }

    /* 頂部篩選與音效開關 */
    .top-controls {
      position: relative;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .filter-btn {
      background: var(--frame-bg);
      border: 1px solid #dfd6c9;
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 3px 10px rgba(200, 109, 81, 0.28);
    }

    .sound-toggle {
      background: var(--frame-bg);
      border: 1px solid #dfd6c9;
      color: var(--text-main);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .sound-toggle:hover {
      border-color: var(--primary);
    }

    /* 輪播主容器 */
    .carousel-wrapper {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn {
      position: absolute;
      top: 46%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 253, 249, 0.95);
      border: 1px solid #dfd6c9;
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(62, 58, 54, 0.1);
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .nav-prev { left: -14px; }
    .nav-next { right: -14px; }

    /* 3D 翻轉卡片容器 + 抽卡滑動動畫 */
    .card-scene {
      width: 100%;
      height: 515px;
      perspective: 1100px;
    }

    .card-scene.slide-out-left {
      animation: cardDrawOutLeft 0.45s cubic-bezier(0.32, 0.72, 0, 1) forwards;
    }

    @keyframes cardDrawOutLeft {
      0% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translateX(-115%) rotate(-7deg) scale(0.95); }
    }

    .card-scene.slide-in-right {
      animation: cardSlideInRight 0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes cardSlideInRight {
      0% { opacity: 0; transform: translateX(85px) rotate(3deg) scale(0.96); }
      100% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
    }

    .card-scene.slide-out-right {
      animation: cardDrawOutRight 0.45s cubic-bezier(0.32, 0.72, 0, 1) forwards;
    }

    @keyframes cardDrawOutRight {
      0% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translateX(115%) rotate(7deg) scale(0.95); }
    }

    .card-scene.slide-in-left {
      animation: cardSlideInLeft 0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes cardSlideInLeft {
      0% { opacity: 0; transform: translateX(-85px) rotate(-3deg) scale(0.96); }
      100% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    /* 拍立得相紙外框質感 */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--frame-bg);
      border-radius: 10px;
      box-shadow: var(--shadow);
      border: 1px solid #e7dfd3;
      padding: 15px 15px 16px 15px;
      display: flex;
      flex-direction: column;
    }

    .washi-tape {
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%) rotate(-1.5deg);
      width: 88px;
      height: 20px;
      background: rgba(226, 184, 121, 0.45);
      border-left: 1px dashed rgba(180, 140, 80, 0.35);
      border-right: 1px dashed rgba(180, 140, 80, 0.35);
      backdrop-filter: blur(2px);
      z-index: 6;
      pointer-events: none;
    }

    /* 相框內部的照片框：改為完整顯示不裁切（contain），左右或上下留白自然呈現 */
    .card-front .photo-mat {
      position: relative;
      width: 100%;
      height: 228px;
      background: #f1ebe1;
      border-radius: 4px;
      border: 1px solid #e2d9cb;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .card-front .photo-mat img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 3px;
      box-shadow: 0 2px 8px rgba(62, 58, 54, 0.08);
      transition: transform 0.35s ease;
    }

    .card-front:hover .photo-mat img {
      transform: scale(1.02);
    }

    .location-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 253, 249, 0.94);
      color: var(--text-main);
      border: 1px solid #dfd5c5;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 3px 9px;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      z-index: 3;
    }

    .flip-trigger-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(255, 253, 249, 0.96);
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 16px;
      border: 1px solid var(--primary);
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s, background 0.2s, color 0.2s;
      z-index: 3;
    }

    .flip-trigger-badge:hover {
      transform: scale(1.04);
      background: var(--primary);
      color: #fff;
    }

    .card-body {
      padding-top: 13px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .dog-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px dashed #e5ddd0;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .dog-name {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.8px;
    }

    .dog-meta {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
    }

    .tag {
      background: var(--tag-bg);
      color: #7c6348;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .catchphrase {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-main);
      background: #f9f6f0;
      padding: 8px 11px;
      border-radius: 6px;
      border-left: 2.5px solid var(--secondary);
      margin-bottom: 10px;
    }

    .interact-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .action-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s;
      user-select: none;
    }

    .action-btn:active {
      transform: scale(0.94);
    }

    .btn-pet {
      background: #fae8e2;
      border-color: #f0d2c8;
      color: #b84c32;
    }

    .btn-pet:hover { background: #f6dbd2; }

    .btn-treat {
      background: #fbf0d9;
      border-color: #eedcb8;
      color: #9e6b14;
    }

    .btn-treat:hover { background: #f7e6c4; }

    /* 卡片背面 */
    .card-back {
      transform: rotateY(180deg);
      padding: 20px;
      justify-content: space-between;
      background: linear-gradient(180deg, #fffdf9 0%, #faf6ef 100%);
    }

    .back-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #dcd2c3;
      padding-bottom: 10px;
    }

    .back-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .back-close-btn {
      background: #f1eae0;
      border: 1px solid #e2d8c9;
      padding: 4px 11px;
      border-radius: 14px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }

    .back-close-btn:hover { background: #e6ddd0; }

    .story-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 4px;
      font-size: 13.8px;
      line-height: 1.8;
      color: var(--text-main);
      white-space: pre-line;
    }

    .shelter-info {
      background: var(--tag-bg);
      border: 1px solid #e6dccd;
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 11.5px;
      color: #6b5a47;
      margin-bottom: 11px;
      line-height: 1.5;
    }

    .official-link-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 11px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      box-shadow: 0 4px 12px rgba(200, 109, 81, 0.28);
      transition: background 0.2s, transform 0.2s;
    }

    .official-link-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    /* 底部圓點與「想看更多」按鈕 */
    .footer-area {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .dots-container {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d5ccc0;
      cursor: pointer;
      transition: all 0.3s;
    }

    .dot.active {
      width: 20px;
      border-radius: 6px;
      background: var(--primary);
    }

    .see-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--frame-bg);
      color: var(--text-main);
      border: 1px solid #d8cec0;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(62, 58, 54, 0.06);
      transition: all 0.2s ease;
    }

    .see-more-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- 全螢幕光暈與飄浮特效層 -->
  <div class="screen-flash" id="screenFlash"></div>
  <div class="fx-overlay" id="fxOverlay"></div>

  <!-- 中央Q版小劇場動畫框 -->
  <div class="chibi-stage" id="chibiStage">
    <div id="chibiSceneContainer"></div>
    <div class="chibi-caption" id="chibiCaption"></div>
  </div>

  <!-- 頂部篩選與音效開關 -->
  <div class="top-controls" id="filterBar">
    <button class="filter-btn active" data-filter="all">🐾 全部</button>
    <button class="filter-btn" data-filter="親人撒嬌">🥰 親人撒嬌</button>
    <button class="filter-btn" data-filter="穩重乖巧">🐶 穩重乖巧</button>
    <button class="filter-btn" data-filter="活力滿滿">⚡ 活力滿滿</button>
    <button class="sound-toggle" id="soundToggleBtn" title="切換音效">🔊</button>
  </div>

  <!-- 輪播卡片區 -->
  <div class="carousel-wrapper" id="carouselWrapper">
    <button class="nav-btn nav-prev" id="prevBtn" title="上一隻">❮</button>
    
    <div class="card-scene" id="cardScene">
      <div class="card-inner" id="cardInner">
        <!-- 卡片正面（拍立得文青白框） -->
        <div class="card-face card-front">
          <div class="washi-tape"></div>
          <div class="photo-mat">
            <span class="location-badge" id="dogLocation">📍 臺北市</span>
            <img id="dogImage" src="" alt="狗狗照片" />
            <button class="flip-trigger-badge" id="flipToBackBtn">💌 聽聽牠的心聲</button>
          </div>
          <div class="card-body">
            <div>
              <div class="dog-header">
                <span class="dog-name" id="dogName">冰塊</span>
                <span class="dog-meta" id="dogMeta">男生・哈士奇・黑白</span>
              </div>
              <div class="tags-row" id="dogTags"></div>
              <div class="catchphrase" id="dogQuote"></div>
            </div>

            <div class="interact-row">
              <button class="action-btn btn-pet" id="petBtn">
                🐾 雲端摸頭 <span id="petCount">12</span>
              </button>
              <button class="action-btn btn-treat" id="treatBtn">
                🥫 送罐罐 <span id="treatCount">8</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 卡片背面 -->
        <div class="card-face card-back">
          <div class="washi-tape"></div>
          <div>
            <div class="back-header">
              <span class="back-title" id="backTitle">💌 冰塊的悄悄話</span>
              <button class="back-close-btn" id="flipToFrontBtn">↩ 返回相片</button>
            </div>
            <div class="story-content" id="dogStory"></div>
          </div>

    let soundEnabled = true;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playPetSound() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const notes = [523.25, 783.99];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        const t = now + idx * 0.11;
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(0.16, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.58);
      });

      const barkTime = now + 0.26;
      const barkOsc = ctx.createOscillator();
      const barkGain = ctx.createGain();
      barkOsc.type = "triangle";

      barkOsc.frequency.setValueAtTime(420, barkTime);
      barkOsc.frequency.exponentialRampToValueAtTime(640, barkTime + 0.09);
      barkOsc.frequency.exponentialRampToValueAtTime(480, barkTime + 0.24);

      barkGain.gain.setValueAtTime(0.001, barkTime);
      barkGain.gain.exponentialRampToValueAtTime(0.18, barkTime + 0.04);
      barkGain.gain.exponentialRampToValueAtTime(0.001, barkTime + 0.26);

      barkOsc.connect(barkGain);
      barkGain.connect(ctx.destination);
      barkOsc.start(barkTime);
      barkOsc.stop(barkTime + 0.28);
    }

    function playCanOpenSound() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const clickOsc = ctx.createOscillator();
      const clickGain = ctx.createGain();
      clickOsc.type = "square";
      clickOsc.frequency.setValueAtTime(1650, now);
      clickOsc.frequency.exponentialRampToValueAtTime(620, now + 0.045);

      clickGain.gain.setValueAtTime(0.14, now);
      clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

      clickOsc.connect(clickGain);
      clickGain.connect(ctx.destination);
      clickOsc.start(now);
      clickOsc.stop(now + 0.055);

      const popTime = now + 0.09;
      const bufferSize = Math.floor(ctx.sampleRate * 0.14);
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
      }

      const noiseSource = ctx.createBufferSource();
      noiseSource.buffer = noiseBuffer;

      const bandpass = ctx.createBiquadFilter();
      bandpass.type = "bandpass";
      bandpass.frequency.setValueAtTime(2200, popTime);
      bandpass.Q.value = 2.5;

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.45, popTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, popTime + 0.13);

      noiseSource.connect(bandpass);
      bandpass.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noiseSource.start(popTime);

      const pingOsc = ctx.createOscillator();
      const pingGain = ctx.createGain();
      pingOsc.type = "sine";
      pingOsc.frequency.setValueAtTime(1320, popTime);
      pingOsc.frequency.exponentialRampToValueAtTime(1760, popTime + 0.08);

      pingGain.gain.setValueAtTime(0.16, popTime);
      pingGain.gain.exponentialRampToValueAtTime(0.001, popTime + 0.25);

      pingOsc.connect(pingGain);
      pingGain.connect(ctx.destination);
      pingOsc.start(popTime);
      pingOsc.stop(popTime + 0.26);

      const chimeNotes = [659.25, 783.99, 1046.5];
      chimeNotes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        const t = popTime + 0.14 + i * 0.085;
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.38);
      });
    }

          <ellipse cx="95" cy="96" rx="5" ry="3" fill="#ff9ebb" opacity="0.7" />
        </g>
        <g class="chibi-hand-group">
          <path d="M106 130 Q138 92 168 72" stroke="#c86d51" stroke-width="13" stroke-linecap="round" fill="none" />
          <path d="M106 130 Q138 92 168 72" stroke="#3e3a36" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25" />
          <ellipse cx="174" cy="69" rx="13" ry="9" transform="rotate(-18 174 69)" fill="#ffe0bd" stroke="#3e3a36" stroke-width="3" />
        </g>
      </svg>
    `;

    const CHIBI_CAN_SVG = `
      <svg width="240" height="165" viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg">
        <circle cx="140" cy="100" r="72" fill="#fff8e6" />
        <g class="can-food-puff">
          <ellipse cx="122" cy="64" rx="14" ry="9" transform="rotate(-18 122 64)" fill="#e57373" stroke="#5c4033" stroke-width="2.5" />
          <circle cx="118" cy="62" r="2.5" fill="#ffe0e0" />
          <ellipse cx="158" cy="58" rx="13" ry="8.5" transform="rotate(15 158 58)" fill="#ef8a6c" stroke="#5c4033" stroke-width="2.5" />
          <path d="M136 42 C136 37, 143 37, 143 42 C143 37, 150 37, 150 42 C150 48, 143 52, 143 52 C143 52, 136 48, 136 42 Z" fill="#ff6b8b" />
          <path d="M184 44 L186 49 L191 51 L186 53 L184 58 L182 53 L177 51 L182 49 Z" fill="#ffb703" />
          <path d="M96 50 L98 54 L102 56 L98 58 L96 62 L94 58 L90 56 L94 54 Z" fill="#ffb703" />
        </g>
        <g class="can-body">
          <rect x="96" y="84" width="88" height="66" rx="12" fill="#ffd166" stroke="#3e3a36" stroke-width="3" />
          <rect x="96" y="102" width="88" height="28" fill="#fffdf7" stroke="#3e3a36" stroke-width="2.5" />
          <circle cx="124" cy="115" r="3.5" fill="#3e3a36" />
          <circle cx="156" cy="115" r="3.5" fill="#3e3a36" />
          <path d="M134 120 Q140 126 146 120" stroke="#3e3a36" stroke-width="2.8" stroke-linecap="round" fill="none" />
          <ellipse cx="116" cy="120" rx="5" ry="2.8" fill="#ff9ebb" opacity="0.75" />
          <ellipse cx="164" cy="120" rx="5" ry="2.8" fill="#ff9ebb" opacity="0.75" />
          <rect x="93" y="144" width="94" height="8" rx="4" fill="#e0a938" stroke="#3e3a36" stroke-width="2.8" />
        </g>
        <g class="can-lid">
          <ellipse cx="140" cy="82" rx="45" ry="9" fill="#cfd8dc" stroke="#3e3a36" stroke-width="2.8" />
          <circle cx="168" cy="79" r="6" fill="none" stroke="#3e3a36" stroke-width="2.5" />
        </g>
      </svg>
    `;

    function playChibiTheater(type, dogNameText) {
      isTheaterPlaying = true;
      const isPet = type === "pet";
      chibiSceneContainer.innerHTML = isPet ? CHIBI_PET_SVG : CHIBI_CAN_SVG;
      chibiCaption.textContent = isPet
        ? `🤍 雲端摸摸 ${dogNameText} 的頭～好舒服呀！`
        : `🥫 啵！幫 ${dogNameText} 打開香噴噴罐罐囉！`;

      chibiStage.classList.remove("show");
      void chibiStage.offsetWidth;
      chibiStage.classList.add("show");

      setTimeout(() => {
        isTheaterPlaying = false;
      }, 1700);
    }

    dogImage.addEventListener("error", () => {
      if (dogImage.src !== FALLBACK_DOG_IMAGE) {
        dogImage.src = FALLBACK_DOG_IMAGE;
      }
    });

    function fillCardContent(targetIndex) {
      if (filteredDogs.length === 0) return;
      const dog = filteredDogs[targetIndex];
      const counts = getCounts(dog);

      if (isFlipped) {
        isFlipped = false;
        cardInner.classList.remove("is-flipped");
      }

      dogLocation.textContent = `📍 ${dog.location}`;
      dogImage.alt = `${dog.name} 的照片`;
      dogImage.src = dog.image && dog.image.trim() !== "" ? dog.image : FALLBACK_DOG_IMAGE;
      dogName.textContent = dog.name;
      dogMeta.textContent = dog.meta;
      dogQuote.textContent = dog.quote;
      dogTags.innerHTML = dog.tags.map(t => `<span class="tag">#${t}</span>`).join("");

      petCount.textContent = counts.pets;
      treatCount.textContent = counts.treats;

      backTitle.textContent = `💌 ${dog.name}的悄悄話`;
      dogStory.textContent = dog.story;
      shelterInfo.textContent = `🏠 所在位置：${dog.shelterName}`;
      officialLink.href = dog.officialUrl && dog.officialUrl.trim() !== ""
        ? dog.officialUrl
        : "https://www.pet.gov.tw/AnimalApp/AnnounceMent.aspx?PageType=Adopt";

      renderDots(targetIndex);
    }

    function switchCardWithSlide(newIndex, direction = "next") {
      if (filteredDogs.length <= 1) return;
      if (isTransitioning) return;

      const normalizedIndex = ((newIndex % filteredDogs.length) + filteredDogs.length) % filteredDogs.length;
      if (normalizedIndex === currentIndex) return;

      isTransitioning = true;

      cardScene.classList.remove("slide-out-left", "slide-in-right", "slide-out-right", "slide-in-left");
      void cardScene.offsetWidth;

      const outClass = direction === "next" ? "slide-out-left" : "slide-out-right";
      const inClass = direction === "next" ? "slide-in-right" : "slide-in-left";

      cardScene.classList.add(outClass);

      setTimeout(() => {
        currentIndex = normalizedIndex;
        fillCardContent(currentIndex);

        cardScene.classList.remove(outClass);
        void cardScene.offsetWidth;

        cardScene.classList.add(inClass);

        setTimeout(() => {
          cardScene.classList.remove(inClass);
          isTransitioning = false;
        }, 520);
      }, 420);
    }

    function renderDots(activeIdx = currentIndex) {
      dotsContainer.innerHTML = "";
      filteredDogs.forEach((_, idx) => {
        const dot = document.createElement("div");
        dot.className = `dot ${idx === activeIdx ? "active" : ""}`;
        dot.addEventListener("click", () => {
          if (idx === currentIndex) return;
          const dir = idx > currentIndex ? "next" : "prev";
          switchCardWithSlide(idx, dir);
          resetAutoPlay();
        });
        dotsContainer.appendChild(dot);
      });
    }

    function triggerFullScreenFx(type) {
      const isPet = type === "pet";
      const pool = isPet
        ? ["💖", "🩷", "🐾", "✨", "🫶", "💕"]
        : ["🥫", "🍖", "💛", "✨", "🦴", "💖"];

      screenFlash.className = "screen-flash";
      void screenFlash.offsetWidth;
      screenFlash.classList.add(isPet ? "pet-flash" : "treat-flash");

      const total = 22;
      for (let i = 0; i < total; i++) {
        const el = document.createElement("div");
        el.className = "fx-item";
        el.textContent = pool[Math.floor(Math.random() * pool.length)];

        const xPos = (5 + Math.random() * 90).toFixed(1) + "%";
        const size = (20 + Math.random() * 18).toFixed(0) + "px";
        const dur = (1.5 + Math.random() * 0.9).toFixed(2) + "s";
        const delay = (Math.random() * 0.45).toFixed(2) + "s";

        const sway1 = ((Math.random() - 0.5) * 60).toFixed(0) + "px";
        const sway2 = ((Math.random() - 0.5) * 80).toFixed(0) + "px";
        const sway3 = ((Math.random() - 0.5) * 70).toFixed(0) + "px";

        const rot1 = ((Math.random() - 0.5) * 35).toFixed(0) + "deg";
        const rot2 = ((Math.random() - 0.5) * 45).toFixed(0) + "deg";
        const rot3 = ((Math.random() - 0.5) * 50).toFixed(0) + "deg";

        el.style.setProperty("--x", xPos);
        el.style.setProperty("--size", size);
        el.style.setProperty("--dur", dur);
        el.style.setProperty("--delay", delay);
        el.style.setProperty("--sway1", sway1);
        el.style.setProperty("--sway2", sway2);
        el.style.setProperty("--sway3", sway3);
        el.style.setProperty("--rot1", rot1);
        el.style.setProperty("--rot2", rot2);
        el.style.setProperty("--rot3", rot3);

        fxOverlay.appendChild(el);
        setTimeout(() => el.remove(), 2600);
      }
    }

    document.getElementById("petBtn").addEventListener("click", function () {
      const dog = filteredDogs[currentIndex];
      const counts = getCounts(dog);
      counts.pets += 1;
      petCount.textContent = counts.pets;
      saveCounts();
      playPetSound();
      playChibiTheater("pet", dog.name);
      triggerFullScreenFx("pet");
      resetAutoPlay();
    });

    document.getElementById("treatBtn").addEventListener("click", function () {
      const dog = filteredDogs[currentIndex];
      const counts = getCounts(dog);
      counts.treats += 1;
      treatCount.textContent = counts.treats;
      saveCounts();
      playCanOpenSound();
      playChibiTheater("treat", dog.name);
      triggerFullScreenFx("treat");
      resetAutoPlay();
    });

    document.getElementById("flipToBackBtn").addEventListener("click", () => {
      isFlipped = true;
      cardInner.classList.add("is-flipped");
    });

    document.getElementById("flipToFrontBtn").addEventListener("click", () => {
      isFlipped = false;
      cardInner.classList.remove("is-flipped");
      resetAutoPlay();
    });

    function nextSlide() {
      switchCardWithSlide(currentIndex + 1, "next");
    }

    function prevSlide() {
      switchCardWithSlide(currentIndex - 1, "prev");
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      nextSlide();
      resetAutoPlay();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      prevSlide();
      resetAutoPlay();
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (isTransitioning) return;
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        currentFilter = btn.dataset.filter;
        filteredDogs = currentFilter === "all"
          ? [...DOGS_DATA]
          : DOGS_DATA.filter(d => d.category === currentFilter);

        currentIndex = 0;
        fillCardContent(currentIndex);
        resetAutoPlay();
      });
    });

    function startAutoPlay() {
      if (autoPlayTimer) clearInterval(autoPlayTimer);
      autoPlayTimer = setInterval(() => {
        if (!isFlipped && !isTheaterPlaying && !isTransitioning && filteredDogs.length > 1) {
          nextSlide();
        }
      }, 6000);
    }

    function resetAutoPlay() {
      startAutoPlay();
    }

    fillCardContent(currentIndex);
    startAutoPlay();
  </script>
</body>
</html>
